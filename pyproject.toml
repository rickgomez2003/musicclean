[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "musicclean"
version = "0.4.1"
description = "Intelligent music library cleanup, duplicate detection, and metadata analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Rick Gomez" }
]
dependencies = [
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "mutagen>=1.47",
  "blake3>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
musicclean = "musicclean.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/musicclean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["musicclean"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["musicclean"]
