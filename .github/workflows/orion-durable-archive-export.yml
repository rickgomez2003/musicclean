name: Orion Durable Archive Export

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag represented by the archive
        required: true
        type: string
      archive_run_id:
        description: Run ID that produced the release archive artifact
        required: true
        type: string
      retention_class:
        description: Archive retention class
        required: true
        type: choice
        options:
          - operational
          - long-term

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  export:
    name: Export Release Archive
    runs-on: ubuntu-latest
    environment:
      name: release-archive-export

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download release archive artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archive-input
          gh run download "${{ inputs.archive_run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "release-archive-${{ inputs.tag }}-${{ inputs.retention_class }}-${{ inputs.archive_run_id }}" \
            --dir archive-input

      - name: Verify archive before export
        run: |
          python tools/release/verify_retention_archival.py \
            --archive-dir archive-input

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ARCHIVE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install AWS CLI
        run: python -m pip install --upgrade awscli

      - name: Export archive bundle
        env:
          ARCHIVE_BUCKET: ${{ vars.AWS_ARCHIVE_BUCKET }}
          ARCHIVE_PREFIX: ${{ vars.AWS_ARCHIVE_PREFIX }}
          ARCHIVE_TAG: ${{ inputs.tag }}
          ARCHIVE_RETENTION_CLASS: ${{ inputs.retention_class }}
          ARCHIVE_SOURCE_RUN_ID: ${{ inputs.archive_run_id }}
          ARCHIVE_EXPORT_RUN_ID: ${{ github.run_id }}
          ARCHIVE_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/release/export_release_archive.py \
            --archive-dir archive-input \
            --receipt durable-export-receipt.json

      - name: Verify durable export receipt
        run: |
          python tools/release/verify_durable_archive_export.py \
            --receipt durable-export-receipt.json

      - name: Upload export receipt
        uses: actions/upload-artifact@v4
        with:
          name: durable-export-receipt-${{ inputs.tag }}-${{ github.run_id }}
          path: durable-export-receipt.json
          retention-days: 90
          if-no-files-found: error
