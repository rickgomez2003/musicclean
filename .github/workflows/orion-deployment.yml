name: Orion Deployment

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  deployment-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev,orion-runtime,opentelemetry]"

      - name: Validate deployment tests
        run: pytest tests/orion/unit/runtime/test_deployment_paths.py tests/orion/unit/runtime/test_packaging_artifacts.py tests/orion/unit/runtime/test_deployment_validation.py

      - name: Build Docker image
        run: docker build -t musicclean-orion:ci .

      - name: Validate shell syntax
        run: bash -n deploy/linux/install-orion.sh
