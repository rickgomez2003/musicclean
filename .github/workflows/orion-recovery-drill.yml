name: Orion Recovery Drill

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Durable archived release tag to test
        required: false
        type: string
      retention_class:
        description: Durable archive retention class
        required: false
        type: choice
        options:
          - operational
          - long-term
  schedule:
    - cron: "23 7 * * 1"

jobs:
  recovery-drill:
    name: Recovery Drill
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    environment:
      name: release-archive-export

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve drill target
        id: drill
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RETENTION_CLASS: ${{ inputs.retention_class }}
          DEFAULT_TAG: ${{ vars.RECOVERY_DRILL_TAG }}
          DEFAULT_RETENTION_CLASS: ${{ vars.RECOVERY_DRILL_RETENTION_CLASS }}
        run: |
          python tools/release/resolve_recovery_drill_target.py \
            --github-output "${GITHUB_OUTPUT}"

      - name: Start recovery drill
        run: |
          python tools/release/recovery_drill_record.py start \
            --record recovery-drill.json \
            --tag "${{ steps.drill.outputs.tag }}" \
            --retention-class "${{ steps.drill.outputs.retention_class }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ARCHIVE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install AWS CLI
        run: python -m pip install --upgrade awscli

      - name: Download and verify durable archive identity
        env:
          ARCHIVE_BUCKET: ${{ vars.AWS_ARCHIVE_BUCKET }}
          ARCHIVE_PREFIX: ${{ vars.AWS_ARCHIVE_PREFIX }}
          ARCHIVE_TAG: ${{ steps.drill.outputs.tag }}
          ARCHIVE_RETENTION_CLASS: ${{ steps.drill.outputs.retention_class }}
          RESTORE_RUN_ID: ${{ github.run_id }}
          RESTORE_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/release/restore_release_archive.py \
            --download-dir restored-archive \
            --extract-dir restored-evidence \
            --receipt restore-receipt.json

      - name: Verify downloaded archive bundle
        run: |
          python tools/release/verify_retention_archival.py \
            --archive-dir restored-archive

      - name: Extract verified archive
        run: |
          python tools/release/restore_release_archive.py \
            --download-dir restored-archive \
            --extract-dir restored-evidence \
            --receipt restore-receipt.json \
            --extract-verified

      - name: Verify restored audit evidence
        run: |
          python tools/release/verify_audit_evidence.py \
            --evidence restored-evidence/release-audit-evidence.json

      - name: Verify restore receipt
        run: |
          python tools/release/verify_archive_restore.py \
            --receipt restore-receipt.json

      - name: Complete recovery drill
        if: success()
        run: |
          python tools/release/recovery_drill_record.py complete \
            --record recovery-drill.json \
            --restore-receipt restore-receipt.json

      - name: Fail recovery drill record
        if: failure()
        run: |
          python tools/release/recovery_drill_record.py fail \
            --record recovery-drill.json \
            --reason "Recovery workflow step failed"

      - name: Verify recovery drill record
        if: always()
        run: |
          python tools/release/verify_recovery_drill.py \
            --record recovery-drill.json

      - name: Collect prior recovery drill artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior-drills
          gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow "Orion Recovery Drill" \
            --status completed \
            --limit 52 \
            --json databaseId \
            --jq '.[].databaseId' > prior-run-ids.txt

          while read -r run_id; do
            [ -z "${run_id}" ] && continue
            mkdir -p "prior-drills/${run_id}"
            gh run download "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir "prior-drills/${run_id}" \
              --pattern "recovery-drill-*" || true
          done < prior-run-ids.txt

      - name: Build recovery drill history
        if: success()
        run: |
          python tools/release/build_recovery_history.py \
            --prior-root prior-drills \
            --current-record recovery-drill.json \
            --maximum-records 52 \
            --output recovery-drill-history.json

      - name: Evaluate recovery SLOs
        if: success()
        run: |
          python tools/release/evaluate_recovery_slos.py \
            --policy release/recovery-slos.toml \
            --latest-drill recovery-drill.json \
            --history recovery-drill-history.json \
            --output recovery-slo-report.json

      - name: Analyze recovery trends
        if: success()
        run: |
          python tools/release/analyze_recovery_trends.py \
            --history recovery-drill-history.json \
            --short-window 4 \
            --long-window 12 \
            --minimum-trend-samples 4 \
            --output recovery-slo-trend.json

      - name: Verify recovery SLO report
        if: success()
        run: |
          python tools/release/verify_recovery_slos.py \
            --report recovery-slo-report.json

      - name: Verify recovery SLO history
        if: success()
        run: |
          python tools/release/verify_recovery_slo_history.py \
            --trend recovery-slo-trend.json

      - name: Build recovery SLO alert
        if: success()
        run: |
          python tools/release/build_recovery_alert.py \
            --policy release/recovery-alerting.toml \
            --slo-report recovery-slo-report.json \
            --trend-report recovery-slo-trend.json \
            --history recovery-drill-history.json \
            --output recovery-slo-alert.json \
            --summary recovery-slo-alert-summary.md

      - name: Verify recovery SLO alert
        if: success()
        run: |
          python tools/release/verify_recovery_slo_alerting.py \
            --alert recovery-slo-alert.json

      - name: Publish recovery SLO summary
        if: success()
        run: cat recovery-slo-alert-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload recovery drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-drill-${{ steps.drill.outputs.tag }}-${{ github.run_id }}
          path: |
            recovery-drill.json
            recovery-drill-history.json
            recovery-slo-report.json
            recovery-slo-trend.json
            recovery-slo-alert.json
            recovery-slo-alert-summary.md
            restore-receipt.json
            restored-archive/release-archive-manifest.json
            restored-archive/release-archive.SHA256SUMS
            restored-evidence/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload recovery alert handoff
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-alert-handoff-${{ github.run_id }}
          path: recovery-slo-alert.json
          retention-days: 7
          if-no-files-found: error

  external-alert-delivery:
    name: External Recovery Alert Delivery
    needs: recovery-drill
    if: ${{ needs.recovery-drill.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    environment:
      name: recovery-alert-delivery

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download recovery alert handoff
        uses: actions/download-artifact@v4
        with:
          name: recovery-alert-handoff-${{ github.run_id }}

      - name: Collect prior delivery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior-deliveries
          gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow "Orion Recovery Drill" \
            --status completed \
            --limit 52 \
            --json databaseId \
            --jq '.[].databaseId' > prior-delivery-run-ids.txt

          while read -r run_id; do
            [ -z "${run_id}" ] && continue
            mkdir -p "prior-deliveries/${run_id}"
            gh run download "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir "prior-deliveries/${run_id}" \
              --pattern "recovery-alert-delivery-*" || true
          done < prior-delivery-run-ids.txt

      - name: Deliver external recovery alert
        env:
          RECOVERY_ALERT_WEBHOOK_URL: ${{ secrets.RECOVERY_ALERT_WEBHOOK_URL }}
          RECOVERY_ALERT_WEBHOOK_HMAC_SECRET: ${{ secrets.RECOVERY_ALERT_WEBHOOK_HMAC_SECRET }}
        run: |
          python tools/release/deliver_recovery_alert.py \
            --policy release/recovery-alerting.toml \
            --alert recovery-slo-alert.json \
            --receipt recovery-alert-delivery.json

      - name: Verify external recovery alert delivery
        if: always()
        run: |
          python tools/release/verify_external_recovery_alert_delivery.py \
            --receipt recovery-alert-delivery.json

      - name: Build recovery delivery observability
        if: ${{ always() && hashFiles('recovery-alert-delivery.json') != '' }}
        run: |
          python tools/release/build_recovery_delivery_observability.py \
            --policy release/recovery-alerting.toml \
            --receipt recovery-alert-delivery.json \
            --history-root prior-deliveries \
            --output recovery-alert-delivery-observability.json \
            --summary recovery-alert-delivery-summary.md

      - name: Verify recovery delivery observability
        if: ${{ always() && hashFiles('recovery-alert-delivery-observability.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_observability.py \
            --observation recovery-alert-delivery-observability.json

      - name: Evaluate recovery alert delivery SLOs
        if: ${{ always() && hashFiles('recovery-alert-delivery-observability.json') != '' }}
        run: |
          python tools/release/evaluate_recovery_alert_delivery_slos.py \
            --policy release/recovery-alerting.toml \
            --observation recovery-alert-delivery-observability.json \
            --output recovery-alert-delivery-slo.json \
            --summary recovery-alert-delivery-slo-summary.md

      - name: Verify recovery alert delivery SLOs
        if: ${{ always() && hashFiles('recovery-alert-delivery-slo.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_slos.py \
            --report recovery-alert-delivery-slo.json

      - name: Publish recovery delivery summary
        if: ${{ always() && hashFiles('recovery-alert-delivery-summary.md') != '' }}
        run: cat recovery-alert-delivery-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Collect prior delivery SLO evidence
        if: ${{ always() && hashFiles('recovery-alert-delivery-slo.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior-delivery-slos
          gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow "Orion Recovery Drill" \
            --status completed \
            --limit 52 \
            --json databaseId \
            --jq '.[].databaseId' > prior-delivery-slo-run-ids.txt

          while read -r run_id; do
            [ -z "${run_id}" ] && continue
            mkdir -p "prior-delivery-slos/${run_id}"
            gh run download "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir "prior-delivery-slos/${run_id}" \
              --pattern "recovery-alert-delivery-*" || true
          done < prior-delivery-slo-run-ids.txt

      - name: Build recovery alert delivery SLO history
        if: ${{ always() && hashFiles('recovery-alert-delivery-slo.json') != '' }}
        run: |
          python tools/release/build_recovery_alert_delivery_slo_history.py \
            --prior-root prior-delivery-slos \
            --current-report recovery-alert-delivery-slo.json \
            --maximum-records 52 \
            --output recovery-alert-delivery-slo-history.json

      - name: Analyze recovery alert delivery SLO trends
        if: ${{ always() && hashFiles('recovery-alert-delivery-slo-history.json') != '' }}
        run: |
          python tools/release/analyze_recovery_alert_delivery_slo_trends.py \
            --history recovery-alert-delivery-slo-history.json \
            --short-window 4 \
            --long-window 12 \
            --minimum-trend-samples 4 \
            --output recovery-alert-delivery-slo-trend.json \
            --summary recovery-alert-delivery-slo-trend-summary.md

      - name: Verify recovery alert delivery SLO history
        if: ${{ always() && hashFiles('recovery-alert-delivery-slo-trend.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_slo_history.py \
            --trend recovery-alert-delivery-slo-trend.json

      - name: Publish recovery delivery SLO summary
        if: ${{ always() && hashFiles('recovery-alert-delivery-slo-summary.md') != '' }}
        run: cat recovery-alert-delivery-slo-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Build recovery alert delivery SLO alert
        if: ${{ always() && hashFiles('recovery-alert-delivery-slo.json') != '' && hashFiles('recovery-alert-delivery-slo-trend.json') != '' }}
        run: |
          python tools/release/build_recovery_alert_delivery_slo_alert.py \
            --policy release/recovery-alerting.toml \
            --slo-report recovery-alert-delivery-slo.json \
            --trend-report recovery-alert-delivery-slo-trend.json \
            --output recovery-alert-delivery-slo-alert.json \
            --summary recovery-alert-delivery-slo-alert-summary.md

      - name: Verify recovery alert delivery SLO alert
        if: ${{ always() && hashFiles('recovery-alert-delivery-slo-alert.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_slo_alerting.py \
            --alert recovery-alert-delivery-slo-alert.json

      - name: Build recovery alert delivery SLO route
        if: ${{ always() && hashFiles('recovery-alert-delivery-slo-alert.json') != '' }}
        run: |
          python tools/release/build_recovery_alert_delivery_slo_route.py \
            --policy release/recovery-alerting.toml \
            --alert recovery-alert-delivery-slo-alert.json \
            --output recovery-alert-delivery-slo-route.json \
            --summary recovery-alert-delivery-slo-route-summary.md

      - name: Verify recovery alert delivery SLO route
        if: ${{ always() && hashFiles('recovery-alert-delivery-slo-route.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_slo_routing.py \
            --route recovery-alert-delivery-slo-route.json

      - name: Deliver routed recovery alert
        if: ${{ always() && hashFiles('recovery-alert-delivery-slo-route.json') != '' }}
        shell: bash
        env:
          RECOVERY_ALERT_OPERATIONS_WEBHOOK_URL: ${{ secrets.RECOVERY_ALERT_OPERATIONS_WEBHOOK_URL }}
          RECOVERY_ALERT_OPERATIONS_HMAC_SECRET: ${{ secrets.RECOVERY_ALERT_OPERATIONS_HMAC_SECRET }}
          RECOVERY_ALERT_INCIDENT_WEBHOOK_URL: ${{ secrets.RECOVERY_ALERT_INCIDENT_WEBHOOK_URL }}
          RECOVERY_ALERT_INCIDENT_HMAC_SECRET: ${{ secrets.RECOVERY_ALERT_INCIDENT_HMAC_SECRET }}
        run: |
          route="$(python -c 'import json; print(json.load(open("recovery-alert-delivery-slo-route.json", encoding="utf-8"))["route"])')"

          if [ "${route}" = "operations" ]; then
            endpoint_url="${RECOVERY_ALERT_OPERATIONS_WEBHOOK_URL}"
            hmac_secret="${RECOVERY_ALERT_OPERATIONS_HMAC_SECRET}"
          elif [ "${route}" = "incident-response" ]; then
            endpoint_url="${RECOVERY_ALERT_INCIDENT_WEBHOOK_URL}"
            hmac_secret="${RECOVERY_ALERT_INCIDENT_HMAC_SECRET}"
          else
            echo "No routed recovery alert delivery required for route: ${route}"
            exit 0
          fi

          if [ -z "${endpoint_url}" ] || [ -z "${hmac_secret}" ]; then
            echo "Required routed recovery alert delivery secret is not configured"
            exit 1
          fi

          python tools/release/deliver_routed_recovery_alert.py \
            --route recovery-alert-delivery-slo-route.json \
            --alert recovery-alert-delivery-slo-alert.json \
            --endpoint-url "${endpoint_url}" \
            --hmac-secret "${hmac_secret}" \
            --policy release/recovery-alerting.toml \
            --receipt recovery-alert-routed-delivery.json

      - name: Verify routed recovery alert delivery
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_routed_delivery.py \
            --receipt recovery-alert-routed-delivery.json

      - name: Verify routed recovery alert delivery resilience
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_routed_delivery_resilience.py \
            --receipt recovery-alert-routed-delivery.json

      - name: Build routed recovery alert delivery observability
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery.json') != '' }}
        run: |
          python tools/release/build_recovery_alert_routed_delivery_observability.py \
            --policy release/recovery-alerting.toml \
            --receipt recovery-alert-routed-delivery.json \
            --history-root prior-deliveries \
            --output recovery-alert-routed-delivery-observability.json \
            --summary recovery-alert-routed-delivery-observability-summary.md

      - name: Verify routed recovery alert delivery observability
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery-observability.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_routed_delivery_observability.py \
            --observation recovery-alert-routed-delivery-observability.json

      - name: Evaluate routed recovery alert delivery SLOs
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery-observability.json') != '' }}
        run: |
          python tools/release/evaluate_recovery_alert_routed_delivery_slos.py \
            --policy release/recovery-alerting.toml \
            --observation recovery-alert-routed-delivery-observability.json \
            --output recovery-alert-routed-delivery-slo.json \
            --summary recovery-alert-routed-delivery-slo-summary.md

      - name: Verify routed recovery alert delivery SLOs
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery-slo.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_routed_delivery_slos.py \
            --report recovery-alert-routed-delivery-slo.json

      - name: Build routed recovery alert delivery SLO history
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery-slo.json') != '' }}
        run: |
          python tools/release/build_recovery_alert_routed_delivery_slo_history.py \
            --policy release/recovery-alerting.toml \
            --report recovery-alert-routed-delivery-slo.json \
            --history-root prior-deliveries \
            --output recovery-alert-routed-delivery-slo-history.json

      - name: Analyze routed recovery alert delivery SLO trends
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery-slo-history.json') != '' }}
        run: |
          python tools/release/analyze_recovery_alert_routed_delivery_slo_trends.py \
            --policy release/recovery-alerting.toml \
            --history recovery-alert-routed-delivery-slo-history.json \
            --output recovery-alert-routed-delivery-slo-trend.json \
            --summary recovery-alert-routed-delivery-slo-trend-summary.md

      - name: Verify routed recovery alert delivery SLO history
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery-slo-trend.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_routed_delivery_slo_history.py \
            --history recovery-alert-routed-delivery-slo-history.json \
            --trend recovery-alert-routed-delivery-slo-trend.json

      - name: Build routed recovery alert delivery SLO alert
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery-slo.json') != '' && hashFiles('recovery-alert-routed-delivery-slo-trend.json') != '' && hashFiles('recovery-alert-routed-delivery-slo-history.json') != '' }}
        run: |
          python tools/release/build_recovery_alert_routed_delivery_slo_alert.py \
            --policy release/recovery-alerting.toml \
            --slo-report recovery-alert-routed-delivery-slo.json \
            --trend-report recovery-alert-routed-delivery-slo-trend.json \
            --history recovery-alert-routed-delivery-slo-history.json \
            --output recovery-alert-routed-delivery-slo-alert.json \
            --summary recovery-alert-routed-delivery-slo-alert-summary.md

      - name: Verify routed recovery alert delivery SLO alert
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery-slo-alert.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_routed_delivery_slo_alerting.py \
            --alert recovery-alert-routed-delivery-slo-alert.json

      - name: Build routed recovery alert delivery SLO route
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery-slo-alert.json') != '' }}
        run: |
          python tools/release/build_recovery_alert_routed_delivery_slo_route.py \
            --policy release/recovery-alerting.toml \
            --alert recovery-alert-routed-delivery-slo-alert.json \
            --output recovery-alert-routed-delivery-slo-route.json \
            --summary recovery-alert-routed-delivery-slo-route-summary.md

      - name: Verify routed recovery alert delivery SLO route
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery-slo-route.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_routed_delivery_slo_routing.py \
            --route recovery-alert-routed-delivery-slo-route.json

      - name: Deliver routed recovery SLO alert
        if: ${{ always() && hashFiles('recovery-alert-routed-delivery-slo-route.json') != '' }}
        shell: bash
        env:
          RECOVERY_SLO_ALERT_OPERATIONS_WEBHOOK_URL: ${{ secrets.RECOVERY_SLO_ALERT_OPERATIONS_WEBHOOK_URL }}
          RECOVERY_SLO_ALERT_OPERATIONS_HMAC_SECRET: ${{ secrets.RECOVERY_SLO_ALERT_OPERATIONS_HMAC_SECRET }}
          RECOVERY_SLO_ALERT_INCIDENT_WEBHOOK_URL: ${{ secrets.RECOVERY_SLO_ALERT_INCIDENT_WEBHOOK_URL }}
          RECOVERY_SLO_ALERT_INCIDENT_HMAC_SECRET: ${{ secrets.RECOVERY_SLO_ALERT_INCIDENT_HMAC_SECRET }}
        run: |
          route="$(python -c 'import json; print(json.load(open("recovery-alert-routed-delivery-slo-route.json", encoding="utf-8"))["route"])')"

          if [ "${route}" = "operations" ]; then
            endpoint_url="${RECOVERY_SLO_ALERT_OPERATIONS_WEBHOOK_URL}"
            hmac_secret="${RECOVERY_SLO_ALERT_OPERATIONS_HMAC_SECRET}"
          elif [ "${route}" = "incident-response" ]; then
            endpoint_url="${RECOVERY_SLO_ALERT_INCIDENT_WEBHOOK_URL}"
            hmac_secret="${RECOVERY_SLO_ALERT_INCIDENT_HMAC_SECRET}"
          else
            echo "No routed SLO alert delivery required for route: ${route}"
            exit 0
          fi

          if [ -z "${endpoint_url}" ] || [ -z "${hmac_secret}" ]; then
            echo "Required routed SLO alert delivery secret is not configured"
            exit 1
          fi

          python tools/release/deliver_routed_recovery_slo_alert.py \
            --route recovery-alert-routed-delivery-slo-route.json \
            --alert recovery-alert-routed-delivery-slo-alert.json \
            --endpoint-url "${endpoint_url}" \
            --hmac-secret "${hmac_secret}" \
            --policy release/recovery-alerting.toml \
            --receipt recovery-alert-routed-slo-delivery.json

      - name: Verify routed recovery SLO alert delivery
        if: ${{ always() && hashFiles('recovery-alert-routed-slo-delivery.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_routed_slo_alert_delivery.py \
            --receipt recovery-alert-routed-slo-delivery.json

      - name: Build routed recovery SLO alert delivery observability
        if: ${{ always() && hashFiles('recovery-alert-routed-slo-delivery.json') != '' }}
        run: |
          python tools/release/build_recovery_alert_routed_slo_delivery_observability.py \
            --policy release/recovery-alerting.toml \
            --receipt recovery-alert-routed-slo-delivery.json \
            --output recovery-alert-routed-slo-delivery-observability.json \
            --summary recovery-alert-routed-slo-delivery-observability-summary.md

      - name: Verify routed recovery SLO alert delivery observability
        if: ${{ always() && hashFiles('recovery-alert-routed-slo-delivery-observability.json') != '' }}
        run: |
          python tools/release/verify_recovery_alert_delivery_routed_slo_alert_delivery_observability.py \
