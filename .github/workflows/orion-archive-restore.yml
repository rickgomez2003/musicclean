name: Orion Archive Restore

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag represented by the durable archive
        required: true
        type: string
      retention_class:
        description: Archive retention class
        required: true
        type: choice
        options:
          - operational
          - long-term

permissions:
  contents: read
  id-token: write

jobs:
  restore:
    name: Restore Release Archive
    runs-on: ubuntu-latest
    environment:
      name: release-archive-export

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ARCHIVE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install AWS CLI
        run: python -m pip install --upgrade awscli

      - name: Download and verify durable archive identity
        env:
          ARCHIVE_BUCKET: ${{ vars.AWS_ARCHIVE_BUCKET }}
          ARCHIVE_PREFIX: ${{ vars.AWS_ARCHIVE_PREFIX }}
          ARCHIVE_TAG: ${{ inputs.tag }}
          ARCHIVE_RETENTION_CLASS: ${{ inputs.retention_class }}
          RESTORE_RUN_ID: ${{ github.run_id }}
          RESTORE_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/release/restore_release_archive.py \
            --download-dir restored-archive \
            --extract-dir restored-evidence \
            --receipt restore-receipt.json

      - name: Verify downloaded archive bundle
        run: |
          python tools/release/verify_retention_archival.py \
            --archive-dir restored-archive

      - name: Extract verified archive
        run: |
          python tools/release/restore_release_archive.py \
            --download-dir restored-archive \
            --extract-dir restored-evidence \
            --receipt restore-receipt.json \
            --extract-verified

      - name: Verify restored audit evidence
        run: |
          python tools/release/verify_audit_evidence.py \
            --evidence restored-evidence/release-audit-evidence.json

      - name: Verify restore receipt
        run: |
          python tools/release/verify_archive_restore.py \
            --receipt restore-receipt.json

      - name: Upload restore evidence
        uses: actions/upload-artifact@v4
        with:
          name: archive-restore-${{ inputs.tag }}-${{ github.run_id }}
          path: |
            restore-receipt.json
            restored-archive/release-archive-manifest.json
            restored-archive/release-archive.SHA256SUMS
            restored-evidence/
          retention-days: 90
          if-no-files-found: error
