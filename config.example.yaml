paths:
  downloads:
    - /mnt/Data/Media/Downloads/sabnzdb/complete/music/
  library:
    - /mnt/Data/Media/Music/

database:
  path: .musicclean/musicclean.db

logging:
  directory: .musicclean/logs
  level: INFO
  max_bytes: 10485760
  backup_count: 5

scanner:
  follow_symlinks: false
  include_hidden: false
  batch_size: 250
  hash_files: true
  read_metadata: true
  hash_chunk_size: 4194304
  extensions:
    - .flac
    - .mp3
    - .m4a
    - .mp4
    - .aac
    - .alac
    - .ogg
    - .opus
    - .wav
    - .aiff
    - .aif
    - .ape
    - .wv
    - .dsf
