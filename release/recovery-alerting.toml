[alerting]
schema_version = 1
suppression_window_hours = 24
consecutive_failure_escalation = 2
provider = "generic-webhook"
external_delivery_enabled = true

[alerting.severity]
warn = "ADVISORY"
fail = "CRITICAL"
worsening = "ADVISORY"
escalated = "ESCALATED"

[alerting.delivery]
environment = "recovery-alert-delivery"
url_secret = "RECOVERY_ALERT_WEBHOOK_URL"
hmac_secret = "RECOVERY_ALERT_WEBHOOK_HMAC_SECRET"
request_timeout_seconds = 10
max_attempts = 4
initial_backoff_seconds = 1
maximum_backoff_seconds = 8
retry_statuses = [408, 429]
retry_server_errors = true
require_https = true
sign_payload = true
idempotency_header = "X-MusicClean-Delivery-ID"
signature_header = "X-MusicClean-Signature-SHA256"

[alerting.observability]
schema_version = 1
history_limit = 52
short_window = 4
long_window = 12
minimum_trend_samples = 4
publish_step_summary = true
retain_days = 90
record_attempt_count = true
record_retry_count = true
record_failure_class = true
record_status_code = true
record_delivery_latency = true
record_delivery_id = true
record_destination = false
record_secret_material = false

[alerting.slos]
schema_version = 1
minimum_samples = 4
publish_step_summary = true
retain_days = 90

[alerting.slos.success_rate]
warn_below = 0.99
fail_below = 0.95

[alerting.slos.retry_rate]
warn_above = 0.10
fail_above = 0.25

[alerting.slos.terminal_failure_rate]
warn_above = 0.02
fail_above = 0.05

[alerting.slos.average_latency_seconds]
warn_above = 5.0
fail_above = 10.0

[alerting.slo_history]
schema_version = 1
maximum_records = 52
short_window = 4
long_window = 12
minimum_trend_samples = 4
retain_days = 90
deduplicate = true
