[alerting]
schema_version = 1
suppression_window_hours = 24
consecutive_failure_escalation = 2
provider = "generic-webhook"
external_delivery_enabled = true

[alerting.severity]
warn = "ADVISORY"
fail = "CRITICAL"
worsening = "ADVISORY"
escalated = "ESCALATED"

[alerting.delivery]
environment = "recovery-alert-delivery"
url_secret = "RECOVERY_ALERT_WEBHOOK_URL"
hmac_secret = "RECOVERY_ALERT_WEBHOOK_HMAC_SECRET"
request_timeout_seconds = 10
max_attempts = 4
initial_backoff_seconds = 1
maximum_backoff_seconds = 8
retry_statuses = [408, 429]
retry_server_errors = true
require_https = true
sign_payload = true
idempotency_header = "X-MusicClean-Delivery-ID"
signature_header = "X-MusicClean-Signature-SHA256"

[alerting.observability]
schema_version = 1
history_limit = 52
short_window = 4
long_window = 12
minimum_trend_samples = 4
publish_step_summary = true
retain_days = 90
record_attempt_count = true
record_retry_count = true
record_failure_class = true
record_status_code = true
record_delivery_latency = true
record_delivery_id = true
record_destination = false
record_secret_material = false

[alerting.slos]
schema_version = 1
minimum_samples = 4
publish_step_summary = true
retain_days = 90

[alerting.slos.success_rate]
warn_below = 0.99
fail_below = 0.95

[alerting.slos.retry_rate]
warn_above = 0.10
fail_above = 0.25

[alerting.slos.terminal_failure_rate]
warn_above = 0.02
fail_above = 0.05

[alerting.slos.average_latency_seconds]
warn_above = 5.0
fail_above = 10.0

[alerting.slo_history]
schema_version = 1
maximum_records = 52
short_window = 4
long_window = 12
minimum_trend_samples = 4
retain_days = 90
deduplicate = true

[alerting.slo_alerting]
schema_version = 1
minimum_trend_samples = 4
alert_on_worsening_trend = true
consecutive_nonpass_escalation = 2
warn_severity = "ADVISORY"
fail_severity = "CRITICAL"
worsening_severity = "ADVISORY"
escalated_severity = "ESCALATED"
external_delivery_enabled = false

[alerting.slo_routing]
schema_version = 1
default_route = "operations"
escalation_route = "incident-response"
consecutive_nonpass_escalation = 3
escalate_worsening_critical = true
external_delivery_enabled = false

[alerting.slo_routing.routes]
advisory = "operations"
critical = "operations"
escalated = "incident-response"

[alerting.routed_delivery]
schema_version = 1
operations_url_secret = "RECOVERY_ALERT_OPERATIONS_WEBHOOK_URL"
operations_hmac_secret = "RECOVERY_ALERT_OPERATIONS_HMAC_SECRET"
incident_url_secret = "RECOVERY_ALERT_INCIDENT_WEBHOOK_URL"
incident_hmac_secret = "RECOVERY_ALERT_INCIDENT_HMAC_SECRET"
timeout_seconds = 10
require_https = true
signed_payloads = true

[alerting.routed_delivery_resilience]
schema_version = 1
max_attempts = 4
initial_backoff_seconds = 1
backoff_multiplier = 2
max_backoff_seconds = 8
retry_server_errors = true
retry_status_codes = [408, 425, 429]
retry_transport_errors = true
preserve_route_across_retries = true
preserve_delivery_id_across_retries = true

[alerting.routed_delivery_observability]
schema_version = 1
history_limit = 52
record_success_rate = true
record_retry_rate = true
record_attempt_distribution = true
record_route_distribution = true
record_failure_classes = true
record_latency = true
record_destination = false
record_secret_material = false

[alerting.routed_delivery_slos]
schema_version = 1
minimum_samples = 4

[alerting.routed_delivery_slos.success_rate]
warn_below = 0.98
fail_below = 0.95

[alerting.routed_delivery_slos.retry_rate]
warn_above = 0.20
fail_above = 0.35

[alerting.routed_delivery_slos.average_attempts]
warn_above = 1.50
fail_above = 2.00

[alerting.routed_delivery_slos.average_latency_seconds]
warn_above = 5.0
fail_above = 10.0

[alerting.routed_delivery_slos.terminal_http_failure_rate]
warn_above = 0.02
fail_above = 0.05

[alerting.routed_delivery_slos.transport_failure_rate]
warn_above = 0.02
fail_above = 0.05

[alerting.routed_delivery_slo_history]
schema_version = 1
history_limit = 52
short_window = 4
long_window = 12
minimum_trend_samples = 4
trend_tolerance = 0.000001
retain_days = 90
deduplicate = true

[alerting.routed_delivery_slo_alerting]
schema_version = 1
alert_on_worsening_trend = true
consecutive_nonpass_escalation = 2
warn_severity = "ADVISORY"
fail_severity = "CRITICAL"
worsening_severity = "ADVISORY"
escalated_severity = "ESCALATED"
external_delivery_enabled = false

[alerting.routed_delivery_slo_routing]
schema_version = 1
escalated_route = "incident-response"
external_delivery_enabled = false

[alerting.routed_delivery_slo_routing.severity_routes]
NONE = "none"
ADVISORY = "operations"
CRITICAL = "incident-response"
ESCALATED = "incident-response"

[alerting.routed_slo_alert_delivery]
schema_version = 1
https_required = true
signature_algorithm = "hmac-sha256"
operations_secret_prefix = "RECOVERY_SLO_ALERT_OPERATIONS_"
incident_secret_prefix = "RECOVERY_SLO_ALERT_INCIDENT_"

[alerting.routed_slo_alert_delivery_resilience]
schema_version = 1
max_attempts = 3
base_delay_seconds = 1.0
max_delay_seconds = 4.0
retryable_http_statuses = [408, 425, 429, 500, 502, 503, 504]
retry_transport_errors = true
preserve_delivery_id = true

[alerting.routed_slo_alert_delivery_observability]
schema_version = 1
max_attempt_records = 10
retain_days = 90
external_export_enabled = false
